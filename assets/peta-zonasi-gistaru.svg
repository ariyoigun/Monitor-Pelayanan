<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%" style="display: block; border-radius: 14px; overflow: hidden;">
  <defs>
    <!-- Basemap Background Gradient -->
    <linearGradient id="gisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Water & Sea Gradient -->
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.65" />
    </linearGradient>

    <!-- Pin Shadow & Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- MAP BASE BACKGROUND -->
  <rect width="1200" height="480" fill="url(#gisBg)" />

  <!-- COORDINATE GRID (GIS Lat/Long Lines) -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 4">
    <line x1="120" y1="0" x2="120" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="360" y1="0" x2="360" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="720" y1="0" x2="720" y2="480" />
    <line x1="840" y1="0" x2="840" y2="480" />
    <line x1="960" y1="0" x2="960" y2="480" />
    <line x1="1080" y1="0" x2="1080" y2="480" />

    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
  </g>

  <!-- KAWASAN PESISIR & PERAIRAN LAUT JAWA (Utara Demak) -->
  <path d="M 0,0 L 450,0 Q 550,60 700,40 T 1200,90 L 1200,0 Z" fill="url(#seaGrad)" />
  <path d="M 0,0 L 450,0 Q 550,60 700,40 T 1200,90" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.6" />

  <!-- ZONASI POLA RUANG KABUPATEN DEMAK (Poligon Warna-warni Sesuai Standar ATR/BPN) -->
  <!-- 1. KAWASAN PERTANIAN / LP2B & RTH (HIJAU) -->
  <polygon points="40,110 280,95 340,210 180,260 30,220" fill="#10b981" fill-opacity="0.38" stroke="#10b981" stroke-width="1.8" />
  <polygon points="680,80 940,110 990,240 760,260 670,180" fill="#059669" fill-opacity="0.4" stroke="#059669" stroke-width="1.8" />
  <polygon points="260,330 520,310 590,440 290,460 210,410" fill="#10b981" fill-opacity="0.4" stroke="#10b981" stroke-width="1.8" />
  <polygon points="850,310 1150,290 1180,450 820,440" fill="#10b981" fill-opacity="0.38" stroke="#10b981" stroke-width="1.8" />

  <!-- 2. KAWASAN PERMUKIMAN / PERUMAHAN R-1 & R-2 (KUNING / EMAS) -->
  <polygon points="290,130 520,115 570,230 410,265 300,210" fill="#fbbf24" fill-opacity="0.48" stroke="#f59e0b" stroke-width="2" />
  <polygon points="560,190 730,175 780,290 620,310 550,240" fill="#fde047" fill-opacity="0.45" stroke="#f59e0b" stroke-width="2" />
  <polygon points="480,270 700,260 720,380 540,390" fill="#fbbf24" fill-opacity="0.45" stroke="#f59e0b" stroke-width="2" />

  <!-- 3. KAWASAN PERDAGANGAN & JASA K-1 (MERAH) -->
  <polygon points="390,210 520,200 535,275 425,280" fill="#ef4444" fill-opacity="0.55" stroke="#dc2626" stroke-width="2" />
  <polygon points="680,230 790,225 805,300 700,305" fill="#f87171" fill-opacity="0.55" stroke="#dc2626" stroke-width="2" />

  <!-- 4. KAWASAN PERUNTUKAN INDUSTRI KPI (UNGU / COKLAT ABU) -->
  <polygon points="760,150 930,140 980,230 840,245" fill="#a855f7" fill-opacity="0.45" stroke="#9333ea" stroke-width="2" />
  <polygon points="60,260 210,245 250,360 80,380" fill="#8b5cf6" fill-opacity="0.45" stroke="#7c3aed" stroke-width="2" />

  <!-- JARINGAN JALAN ARTERI PRIMER (PANTURA DEMAK) & KOLEKTOR -->
  <path d="M 0,230 Q 320,210 520,240 T 890,230 T 1200,210" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 0,230 Q 320,210 520,240 T 890,230 T 1200,210" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="10 8" />

  <!-- JALAN KOLEKTOR LOKAL & PENGHUBUNG KECAMATAN -->
  <path d="M 440,0 Q 460,180 500,240 T 560,480" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-opacity="0.75" />
  <path d="M 750,0 Q 730,160 740,230 T 800,480" fill="none" stroke="#e2e8f0" stroke-width="2.5" stroke-opacity="0.65" />
  <path d="M 160,240 Q 240,320 280,480" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-opacity="0.6" />

  <!-- SUNGAI UTAMA (Sungai Tuntang & Sungai Wulan) -->
  <path d="M 330,480 Q 360,320 310,210 T 350,0" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.8" />
  <path d="M 920,480 Q 890,340 920,220 T 960,0" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-opacity="0.75" />

  <!-- BIDANG-BIDANG TANAH / PERSIL KECIL (SIMULASI SHP PARCEL) -->
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8" fill="none">
    <rect x="330" y="150" width="35" height="25" />
    <rect x="370" y="150" width="40" height="25" />
    <rect x="330" y="180" width="38" height="25" />
    <rect x="372" y="180" width="38" height="25" />
    <rect x="420" y="150" width="32" height="25" />
    <rect x="420" y="180" width="32" height="25" />

    <rect x="600" y="210" width="36" height="28" />
    <rect x="640" y="210" width="36" height="28" />
    <rect x="600" y="242" width="36" height="28" />
    <rect x="640" y="242" width="36" height="28" />
  </g>

  <!-- INTERACTIVE LOCATION PIN WITH PULSE EFFECT (Pusat Kota Demak / Masjid Agung) -->
  <g transform="translate(485, 220)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="28" fill="#38bdf8" fill-opacity="0.25">
      <animate attributeName="r" values="18;34;18" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="14" fill="#0284c7" fill-opacity="0.4" />
    
    <!-- Pin Marker Shape -->
    <path d="M 0,-34 C -13,-34 -22,-25 -22,-12 C -22,6 0,22 0,22 C 0,22 22,6 22,-12 C 22,-25 13,-34 0,-34 Z" fill="#ef4444" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="0" cy="-14" r="7" fill="#ffffff" />
    <circle cx="0" cy="-14" r="3.5" fill="#ef4444" />
  </g>

  <!-- PIN CALLOUT LABEL (Simulasi Popup Interaktif GIS) -->
  <g transform="translate(520, 168)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="220" height="48" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="24" r="7" fill="#10b981" />
    <text x="34" y="21" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Kabupaten Demak</text>
    <text x="34" y="37" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Pola Ruang: Permukiman &amp; Jasa</text>
  </g>

  <!-- GIS TOOLBAR (Atas Kanan) -->
  <g transform="translate(1080, 24)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="96" height="40" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <!-- Zoom In (+) -->
    <text x="16" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="800">+</text>
    <line x1="38" y1="8" x2="38" y2="32" stroke="#334155" stroke-width="1" />
    <!-- Zoom Out (-) -->
    <text x="50" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="800">-</text>
    <line x1="68" y1="8" x2="68" y2="32" stroke="#334155" stroke-width="1" />
    <!-- Layers Icon -->
    <polygon points="82,15 90,20 82,25 74,20" fill="#38bdf8" />
    <polygon points="82,21 90,26 82,31 74,26" fill="#38bdf8" opacity="0.7" />
  </g>

  <!-- NORTH ARROW COMPASS (Kiri Atas) -->
  <g transform="translate(50, 48)" filter="url(#dropShadow)">
    <circle cx="0" cy="0" r="20" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <polygon points="0,-15 5,0 0,-3 -5,0" fill="#ef4444" />
    <polygon points="0,15 5,0 0,3 -5,0" fill="#94a3b8" />
    <text x="0" y="-18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle">U</text>
  </g>

  <!-- SCALE BAR (Kiri Bawah) -->
  <g transform="translate(40, 435)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="160" height="26" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <line x1="15" y1="17" x2="145" y2="17" stroke="#ffffff" stroke-width="2" />
    <line x1="15" y1="12" x2="15" y2="20" stroke="#ffffff" stroke-width="2" />
    <line x1="80" y1="12" x2="80" y2="20" stroke="#ffffff" stroke-width="2" />
    <line x1="145" y1="12" x2="145" y2="20" stroke="#ffffff" stroke-width="2" />
    <text x="15" y="9" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">0</text>
    <text x="80" y="9" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">500m</text>
    <text x="145" y="9" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="end">1 km</text>
  </g>

  <!-- GIS ZONING LEGEND CHIPS (Bawah Tengah) -->
  <g transform="translate(240, 435)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="720" height="26" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    
    <!-- Permukiman -->
    <rect x="15" y="7" width="12" height="12" rx="2" fill="#fbbf24" stroke="#f59e0b" stroke-width="1" />
    <text x="32" y="17" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Permukiman</text>

    <!-- Perdagangan -->
    <rect x="135" y="7" width="12" height="12" rx="2" fill="#ef4444" stroke="#dc2626" stroke-width="1" />
    <text x="152" y="17" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Perdagangan &amp; Jasa</text>

    <!-- Industri -->
    <rect x="290" y="7" width="12" height="12" rx="2" fill="#a855f7" stroke="#9333ea" stroke-width="1" />
    <text x="307" y="17" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Industri</text>

    <!-- Pertanian -->
    <rect x="400" y="7" width="12" height="12" rx="2" fill="#10b981" stroke="#059669" stroke-width="1" />
    <text x="417" y="17" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Pertanian / RTH</text>

    <!-- Lindung / Air -->
    <rect x="535" y="7" width="12" height="12" rx="2" fill="#0284c7" stroke="#0369a1" stroke-width="1" />
    <text x="552" y="17" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Kawasan Lindung / Pesisir</text>
  </g>

  <!-- FLOATING WATERMARK BADGE (Kanan Bawah) -->
  <g transform="translate(980, 435)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="195" height="26" rx="6" fill="#0284c7" fill-opacity="0.9" />
    <circle cx="14" cy="13" r="5" fill="#38bdf8" />
    <text x="25" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Geoportal GISTARU ATR/BPN</text>
  </g>
</svg>
